<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Hany El Atlassi | AI & Security Engineer</title>
    <meta name="title" content="Hany El Atlassi | AI & Security Engineer" />
    <meta name="description" content="AI & Security engineer and founder of Axon. Builds and deploys ML systems end to end: voice pipelines, multi-agent orchestration, federated learning, and the security infrastructure underneath." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hany El Atlassi | AI & Security Engineer" />
    <meta property="og:description" content="AI & Security engineer and founder of Axon. Voice AI, multi-agent systems, federated learning, and AI security." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Hany El Atlassi | AI & Security Engineer" />
    <meta property="twitter:description" content="AI & Security engineer and founder of Axon. Voice AI, multi-agent systems, federated learning, and AI security." />

    <!-- Theme Color -->
    <meta name="theme-color" content="#ff3700" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;600&display=swap"
    />

    <!-- Apply the stored theme before first paint to avoid a light/dark flash -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
